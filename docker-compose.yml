services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixelart
      POSTGRES_USER: pixelart
      POSTGRES_PASSWORD: pixelart
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./mcp-server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelart -d pixelart"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: localstack/localstack:latest
    restart: unless-stopped
    ports:
      - "9000:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
      DATA_DIR: /var/lib/localstack/data
    volumes:
      - minio-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  mcp-server:
    build: ./mcp-server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MCP_PORT: 8001
      MINIO_ENDPOINT: minio:4566
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: testtest
      MINIO_BUCKET: pixel-art
      MINIO_USE_SSL: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelart
      POSTGRES_USER: pixelart
      POSTGRES_PASSWORD: pixelart
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web-api:
    build: ./web-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: minio:4566
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: testtest
      MINIO_BUCKET: pixel-art
      MINIO_USE_SSL: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelart
      POSTGRES_USER: pixelart
      POSTGRES_PASSWORD: pixelart
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web-ui:
    build: ./web-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - web-api

volumes:
  postgres-data:
  minio-data:
