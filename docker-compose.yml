services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixelart
      POSTGRES_USER: pixelart
      POSTGRES_PASSWORD: pixelart
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./mcp-server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelart -d pixelart"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: pixelart
      MINIO_ROOT_PASSWORD: pixelart123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    build: ./mcp-server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MCP_PORT: 8001
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: pixelart
      MINIO_SECRET_KEY: pixelart123
      MINIO_BUCKET: pixel-art
      MINIO_USE_SSL: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelart
      POSTGRES_USER: pixelart
      POSTGRES_PASSWORD: pixelart
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web-api:
    build: ./web-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: pixelart
      MINIO_SECRET_KEY: pixelart123
      MINIO_BUCKET: pixel-art
      MINIO_USE_SSL: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelart
      POSTGRES_USER: pixelart
      POSTGRES_PASSWORD: pixelart
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web-ui:
    build: ./web-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - web-api

volumes:
  postgres-data:
  minio-data:
