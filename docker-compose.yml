services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixelart
      POSTGRES_USER: pixelart
      POSTGRES_PASSWORD: pixelart
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./mcp-server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelart -d pixelart"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: adobe/s3mock:latest
    restart: unless-stopped
    ports:
      - "9000:9090"
    environment:
      initialBuckets: pixel-art
      retainFilesOnExit: "true"
    volumes:
      - minio-data:/s3mockroot
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/ || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 15

  mcp-server:
    build: ./mcp-server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MCP_PORT: 8001
      MINIO_ENDPOINT: minio:9090
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: testtest
      MINIO_BUCKET: pixel-art
      MINIO_USE_SSL: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelart
      POSTGRES_USER: pixelart
      POSTGRES_PASSWORD: pixelart
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web-api:
    build: ./web-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: minio:9090
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: testtest
      MINIO_BUCKET: pixel-art
      MINIO_USE_SSL: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pixelart
      POSTGRES_USER: pixelart
      POSTGRES_PASSWORD: pixelart
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web-ui:
    build: ./web-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - web-api

volumes:
  postgres-data:
  minio-data:
